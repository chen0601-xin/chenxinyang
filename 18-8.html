<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18-8 电商销售数据大屏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04071a;color:#cfe3ff;font-family:"Microsoft YaHei",sans-serif;overflow-x:hidden}
body{min-height:100vh;background:
  radial-gradient(ellipse at 20% 0%,rgba(30,64,175,.25),transparent 60%),
  radial-gradient(ellipse at 80% 100%,rgba(6,182,212,.2),transparent 55%),
  #04071a}

/* ===== Header ===== */
header{
  position:relative;text-align:center;padding:18px 24px 14px;
  background:linear-gradient(180deg,rgba(12,36,97,.95),rgba(4,7,26,0));
  border-bottom:1px solid rgba(56,189,248,.25);
}
header h1{
  font-size:30px;letter-spacing:8px;font-weight:700;
  background:linear-gradient(90deg,#7dd3fc,#e0f2fe,#67e8f9);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(125,211,252,.15);
}
header .sub{color:#7aa2d6;font-size:12px;margin-top:4px;letter-spacing:3px}
header .time{
  position:absolute;right:30px;top:50%;transform:translateY(-50%);
  font-family:Consolas,monospace;color:#7dd3fc;font-size:14px;letter-spacing:1px;
  text-shadow:0 0 8px rgba(125,211,252,.5);
}
header .time::before{content:"🕐 ";font-size:15px}

/* ===== Layout ===== */
.dashboard{
  display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:16px;
  padding:16px 18px 28px;max-width:100vw;
}
.col{display:flex;flex-direction:column;gap:16px}

/* ===== Panel ===== */
.panel{
  position:relative;background:linear-gradient(160deg,rgba(15,32,80,.7),rgba(6,14,42,.85));
  border:1px solid rgba(56,189,248,.28);border-radius:6px;padding:14px 16px 10px;
  backdrop-filter:blur(6px);
  box-shadow:0 0 18px rgba(30,100,200,.12),inset 0 0 22px rgba(20,60,140,.15);
}
.panel::before,.panel::after,
.panel .c1,.panel .c2{
  content:"";position:absolute;width:14px;height:14px;
  border-color:#38bdf8;border-style:solid;border-width:0;pointer-events:none;
}
.panel::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
.panel::after{top:-1px;right:-1px;border-top-width:2px;border-right-width:2px}
.panel .c1{bottom:-1px;left:-1px;border-bottom-width:2px;border-left-width:2px}
.panel .c2{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}

.panel-title{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:700;color:#7dd3fc;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px dashed rgba(56,189,248,.25);letter-spacing:2px;
}
.panel-title::before{
  content:"";width:4px;height:14px;background:linear-gradient(180deg,#38bdf8,#0891b2);
  border-radius:2px;box-shadow:0 0 8px #38bdf8;
}

/* ===== KPI ===== */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{
  background:rgba(8,20,56,.6);border:1px solid rgba(56,189,248,.2);
  border-radius:4px;padding:10px 12px;position:relative;overflow:hidden;
}
.kpi .label{font-size:11px;color:#7aa2d6;letter-spacing:1px}
.kpi .value{
  font-family:Consolas,monospace;font-size:22px;font-weight:700;
  background:linear-gradient(90deg,#fbbf24,#f59e0b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 16px rgba(251,191,36,.3);margin-top:2px;
}
.kpi .trend{font-size:11px;margin-top:3px}
.kpi .trend.up{color:#22d3ee}.kpi .trend.down{color:#f87171}
.kpi::after{
  content:"";position:absolute;right:-8px;bottom:-8px;width:40px;height:40px;
  border-radius:50%;background:rgba(56,189,248,.08);
}

/* ===== Chart boxes ===== */
.chart{width:100%;height:240px}
.chart-tall{width:100%;height:360px}
.chart-map{width:100%;height:440px}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.4);border-radius:3px}
::-webkit-scrollbar-track{background:rgba(8,20,56,.3)}

/* ===== Responsive ===== */
@media(max-width:1100px){
  .dashboard{grid-template-columns:1fr;max-width:900px;margin:0 auto}
  header h1{font-size:22px;letter-spacing:4px}
  .chart-map{height:360px}
}
</style>
</head>
<body><style>.__home_btn{position:fixed;right:20px;bottom:20px;z-index:9999;background:#235789;color:#fff;padding:9px 16px;border-radius:24px;text-decoration:none;font-size:13px;font-family:"Microsoft YaHei",sans-serif;box-shadow:0 4px 14px rgba(35,87,137,.3);transition:transform .2s}.__home_btn:hover{transform:translateY(-2px);background:#1a4267}</style>
<a class="__home_btn" href="index.html">🏠 返回首页</a>

<header>
    <h1>电 商 销 售 数 据 大 屏</h1>
    <div class="sub">E-COMMERCE · REAL-TIME ANALYTICS · 2026 Q4</div>
    <div class="time" id="clock">--:--:--</div>
</header>

<div class="dashboard">

    <!-- ============ 左列 ============ -->
    <div class="col">
        <div class="panel">
            <div class="c1"></div><div class="c2"></div>
            <div class="panel-title">核 心 指 标 KPI</div>
            <div class="kpi-row">
                <div class="kpi"><div class="label">今日 GMV (万)</div><div class="value" data-target="2863.4">0</div><div class="trend up">▲ 12.4% vs 昨日</div></div>
                <div class="kpi"><div class="label">订单数</div><div class="value" data-target="18426">0</div><div class="trend up">▲ 8.3%</div></div>
                <div class="kpi"><div class="label">活跃用户</div><div class="value" data-target="95832">0</div><div class="trend up">▲ 15.7%</div></div>
                <div class="kpi"><div class="label">客单价 (元)</div><div class="value" data-target="155.4">0</div><div class="trend down">▼ 2.1%</div></div>
            </div>
        </div>

        <div class="panel">
            <div class="c1"></div><div class="c2"></div>
            <div class="panel-title">品类销售 TOP 10</div>
            <div class="chart" id="c_bar"></div>
        </div>

        <div class="panel">
            <div class="c1"></div><div class="c2"></div>
            <div class="panel-title">近 7 日 GMV 趋势</div>
            <div class="chart" id="c_line"></div>
        </div>
    </div>

    <!-- ============ 中间列 ============ -->
    <div class="col">
        <div class="panel">
            <div class="c1"></div><div class="c2"></div>
            <div class="panel-title">全 国 省 份 销 售 热 力 分 布</div>
            <div class="chart-map" id="c_map"></div>
        </div>

        <div class="panel">
            <div class="c1"></div><div class="c2"></div>
            <div class="panel-title">品类销售占比</div>
            <div class="chart-tall" id="c_pie"></div>
        </div>
    </div>

    <!-- ============ 右列 ============ -->
    <div class="col">
        <div class="panel">
            <div class="c1"></div><div class="c2"></div>
            <div class="panel-title">城 市 综 合 对 比</div>
            <div class="chart" id="c_radar"></div>
        </div>

        <div class="panel">
            <div class="c1"></div><div class="c2"></div>
            <div class="panel-title">用户转化漏斗</div>
            <div class="chart" id="c_funnel"></div>
        </div>

        <div class="panel">
            <div class="c1"></div><div class="c2"></div>
            <div class="panel-title">实时订单动态</div>
            <div class="chart" id="c_gauge"></div>
        </div>
    </div>

</div>

<script src="cdn/echarts.min.js"></script>
<script>
/* ============ 时钟 ============ */
(function clock(){
  var el = document.getElementById('clock');
  function tick(){
    var d = new Date();
    el.textContent = d.toLocaleString('zh-CN',{hour12:false});
  }
  tick(); setInterval(tick,1000);
})();

/* ============ KPI 数字滚动 ============ */
(function kpiAnimate(){
  var items = document.querySelectorAll('.kpi .value');
  items.forEach(function(el){
    var t = parseFloat(el.dataset.target);
    var dur = 1600, start = performance.now();
    function step(now){
      var p = Math.min(1,(now-start)/dur);
      var ease = 1 - Math.pow(1-p,3);
      var v = t * ease;
      el.textContent = (t >= 10000 ? Math.round(v) : v.toFixed(1)).toLocaleString();
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
})();

/* ============ ECharts 通用主题 ============ */
var baseOpt = {
  backgroundColor: 'transparent',
  textStyle: { color: '#cfe3ff', fontFamily: 'Microsoft YaHei' }
};

/* ============ 地图数据 ============ */
fetch('cdn/china.json')
  .then(function(r){ return r.json(); })
  .then(function(geo){
    echarts.registerMap('china', geo);
    initCharts();
  })
  .catch(function(){ initCharts(); });

/* ============ 所有图表初始化 ============ */
function initCharts(){

  /* -------- 1. 中国地图 热力 -------- */
  var mapData = [
    ['北京',1862],['上海',2104],['广东',2480],['江苏',1720],['浙江',1560],
    ['山东',980],['四川',820],['湖北',640],['福建',720],['河南',580],
    ['湖南',520],['安徽',460],['河北',440],['辽宁',380],['陕西',320],
    ['重庆',380],['天津',360],['云南',260],['广西',240],['江西',280],
    ['山西',220],['贵州',160],['黑龙江',180],['吉林',140],['内蒙古',120],
    ['新疆',150],['甘肃',100],['海南',180],['宁夏',60],['青海',50],['西藏',30]
  ];
  var cMap = echarts.init(document.getElementById('c_map'));
  cMap.setOption(Object.assign({}, baseOpt, {
    tooltip: {
      trigger: 'item', formatter: function(p){
        return p.name + '<br/>销售额: <b>' + (p.value||0) + ' 万</b>';
      },
      backgroundColor:'rgba(8,20,56,.92)', borderColor:'#38bdf8', textStyle:{color:'#cfe3ff'}
    },
    visualMap: {
      min: 0, max: 2500, calculable: true, left: 20, bottom: 18,
      textStyle: { color: '#7dd3fc' },
      inRange: {
        color: ['#0c2d6b','#1e40af','#0ea5e9','#22d3ee','#34d399','#fbbf24','#f97316','#ef4444']
      }
    },
    geo: {
      map: 'china', roam: true, zoom: 1.15,
      label: { show: true, color: '#e2e8f0', fontSize: 10 },
      itemStyle: {
        areaColor: '#0f2250',
        borderColor: '#38bdf8', borderWidth: 0.7
      },
      emphasis: {
        label: { color: '#fff', fontWeight: 'bold' },
        itemStyle: { areaColor: '#1e40af', borderColor: '#22d3ee', borderWidth: 1.5 }
      }
    },
    series: [{
      type: 'map', geoIndex: 0, data: mapData,
      selectedMode: false
    }]
  }));

  /* -------- 2. 柱状图 TOP10 -------- */
  var cBar = echarts.init(document.getElementById('c_bar'));
  var barData = [
    {name:'智能手机',value:4820},
    {name:'服装',value:3960},
    {name:'家居',value:2840},
    {name:'美妆',value:2480},
    {name:'食品',value:2120},
    {name:'图书',value:1680},
    {name:'数码配件',value:1320},
    {name:'母婴',value:1180},
    {name:'运动',value:960},
    {name:'珠宝',value:720}
  ].sort(function(a,b){return b.value-a.value;});

  cBar.setOption(Object.assign({}, baseOpt, {
    grid: { top: 10, left: 80, right: 20, bottom: 20 },
    xAxis: {
      type: 'value', axisLine:{lineStyle:{color:'#1e3a5f'}},
      axisLabel:{color:'#7aa2d6',fontSize:10},
      splitLine:{lineStyle:{color:'rgba(56,189,248,.1)'}}
    },
    yAxis: {
      type: 'category', data: barData.map(function(d){return d.name}).reverse(),
      axisLine:{lineStyle:{color:'#1e3a5f'}},
      axisLabel:{color:'#cfe3ff',fontSize:11},
      axisTick:{show:false}
    },
    series: [{
      type: 'bar', data: barData.map(function(d){return d.value}).reverse(),
      barWidth: 10,
      itemStyle: {
        borderRadius: [0,5,5,0],
        color: new echarts.graphic.LinearGradient(0,0,1,0,[
          {offset:0,color:'#0891b2'},{offset:1,color:'#38bdf8'}
        ])
      },
      label: { show: true, position: 'right', color: '#7dd3fc', fontSize: 10 }
    }]
  }));

  /* -------- 3. 折线图 7日 -------- */
  var cLine = echarts.init(document.getElementById('c_line'));
  cLine.setOption(Object.assign({}, baseOpt, {
    grid: { top: 20, left: 40, right: 20, bottom: 26 },
    tooltip: { trigger: 'axis', backgroundColor:'rgba(8,20,56,.92)', borderColor:'#38bdf8', textStyle:{color:'#cfe3ff'} },
    xAxis: {
      type:'category', data:['10/30','10/31','11/01','11/02','11/03','11/04','11/05'],
      boundaryGap: false,
      axisLine:{lineStyle:{color:'#1e3a5f'}}, axisLabel:{color:'#7aa2d6',fontSize:10}
    },
    yAxis: {
      type:'value', axisLine:{lineStyle:{color:'#1e3a5f'}},
      axisLabel:{color:'#7aa2d6',fontSize:10},
      splitLine:{lineStyle:{color:'rgba(56,189,248,.1)'}}
    },
    series: [{
      type:'line', smooth: true, symbol:'circle', symbolSize:8,
      data:[1820,2040,1980,2360,2520,2680,2863],
      lineStyle:{color:'#38bdf8',width:3,shadowBlur:10,shadowColor:'rgba(56,189,248,.6)'},
      itemStyle:{color:'#38bdf8',borderColor:'#fff',borderWidth:2},
      areaStyle:{
        color: new echarts.graphic.LinearGradient(0,0,0,1,[
          {offset:0,color:'rgba(56,189,248,.55)'},
          {offset:1,color:'rgba(56,189,248,0)'}
        ])
      }
    }]
  }));

  /* -------- 4. 饼图 品类占比 -------- */
  var cPie = echarts.init(document.getElementById('c_pie'));
  cPie.setOption(Object.assign({}, baseOpt, {
    tooltip: { trigger:'item', backgroundColor:'rgba(8,20,56,.92)', borderColor:'#38bdf8', textStyle:{color:'#cfe3ff'} },
    legend: {
      bottom: 0, itemWidth: 10, itemHeight: 10, textStyle: { color: '#7aa2d6', fontSize: 11 }
    },
    series: [{
      type: 'pie', radius: ['38%','68%'], center: ['50%','44%'],
      avoidLabelOverlap: true, itemStyle: { borderColor: '#04071a', borderWidth: 2 },
      label: { color:'#cfe3ff', fontSize: 11, formatter:'{b}\n{d}%' },
      labelLine: { lineStyle: { color: '#38bdf8' } },
      data: [
        {value:4820,name:'智能手机',itemStyle:{color:'#38bdf8'}},
        {value:3960,name:'服装',itemStyle:{color:'#22d3ee'}},
        {value:2840,name:'家居',itemStyle:{color:'#a78bfa'}},
        {value:2480,name:'美妆',itemStyle:{color:'#f472b6'}},
        {value:2120,name:'食品',itemStyle:{color:'#34d399'}},
        {value:1680,name:'图书',itemStyle:{color:'#fbbf24'}},
        {value:1320,name:'数码配件',itemStyle:{color:'#fb923c'}},
        {value:880,name:'其他',itemStyle:{color:'#64748b'}}
      ]
    }]
  }));

  /* -------- 5. 雷达图 城市对比 -------- */
  var cRadar = echarts.init(document.getElementById('c_radar'));
  cRadar.setOption(Object.assign({}, baseOpt, {
    tooltip:{backgroundColor:'rgba(8,20,56,.92)',borderColor:'#38bdf8',textStyle:{color:'#cfe3ff'}},
    legend:{bottom:0,itemWidth:12,itemHeight:8,textStyle:{color:'#7aa2d6',fontSize:11},data:['北京','上海','广州']},
    radar: {
      indicator:[
        {name:'销售额',max:100},{name:'订单量',max:100},
        {name:'客单价',max:100},{name:'复购率',max:100},
        {name:'新用户',max:100},{name:'满意度',max:100}
      ],
      shape:'polygon', splitNumber:4,
      axisName:{color:'#7dd3fc',fontSize:11},
      splitArea:{areaStyle:{color:['rgba(56,189,248,.03)','rgba(56,189,248,.06)']}},
      splitLine:{lineStyle:{color:'rgba(56,189,248,.25)'}},
      axisLine:{lineStyle:{color:'rgba(56,189,248,.3)'}}
    },
    series:[{
      type:'radar', symbolSize:6, lineStyle:{width:2}, areaStyle:{opacity:0.28},
      data:[
        {value:[92,88,78,72,85,82],name:'北京',itemStyle:{color:'#f59e0b'},areaStyle:{color:'#f59e0b'}},
        {value:[96,94,82,80,90,88],name:'上海',itemStyle:{color:'#22d3ee'},areaStyle:{color:'#22d3ee'}},
        {value:[84,80,70,75,78,80],name:'广州',itemStyle:{color:'#f472b6'},areaStyle:{color:'#f472b6'}}
      ]
    }]
  }));

  /* -------- 6. 漏斗图 转化 -------- */
  var cFunnel = echarts.init(document.getElementById('c_funnel'));
  cFunnel.setOption(Object.assign({}, baseOpt, {
    tooltip:{trigger:'item',backgroundColor:'rgba(8,20,56,.92)',borderColor:'#38bdf8',textStyle:{color:'#cfe3ff'},formatter:'{b}: {c} ({d}%)'},
    series:[{
      type:'funnel', left:'5%', top:10, bottom:10, width:'90%',
      min:0, max:10000, minSize:'0%', maxSize:'100%', sort:'descending',
      gap:2, label:{color:'#cfe3ff',fontSize:11,position:'inside'},
      itemStyle:{borderColor:'#04071a',borderWidth:2},
      data:[
        {value:10000,name:'浏览商品',itemStyle:{color:'#0ea5e9'}},
        {value:6200,name:'加入购物车',itemStyle:{color:'#22d3ee'}},
        {value:3800,name:'提交订单',itemStyle:{color:'#34d399'}},
        {value:2950,name:'支付成功',itemStyle:{color:'#fbbf24'}},
        {value:2400,name:'完成复购',itemStyle:{color:'#f472b6'}}
      ]
    }]
  }));

  /* -------- 7. 仪表盘 实时 -------- */
  var cGauge = echarts.init(document.getElementById('c_gauge'));
  cGauge.setOption(Object.assign({}, baseOpt, {
    series:[{
      type:'gauge', startAngle:200, endAngle:-20, radius:'92%', center:['50%','58%'],
      min:0, max:20000, splitNumber:5,
      axisLine:{lineStyle:{width:12,color:[
        [0.3,'#22d3ee'],[0.6,'#38bdf8'],[0.85,'#fbbf24'],[1,'#ef4444']
      ]}},
      pointer:{length:'55%',width:4,itemStyle:{color:'#f59e0b'}},
      axisTick:{distance:-14,length:6,lineStyle:{color:'#04071a',width:1}},
      splitLine:{distance:-14,length:14,lineStyle:{color:'#04071a',width:2}},
      axisLabel:{distance:20,color:'#7aa2d6',fontSize:10},
      title:{offsetCenter:[0,'65%'],color:'#7dd3fc',fontSize:12},
      detail:{offsetCenter:[0,'30%'],color:'#fbbf24',fontSize:24,fontWeight:'bold',fontFamily:'Consolas'},
      data:[{value:18426,name:'当前订单数'}]
    }]
  }));

  /* ============ 自适应 ============ */
  function resizeAll(){
    [cMap,cBar,cLine,cPie,cRadar,cFunnel,cGauge].forEach(function(c){c.resize();});
  }
  window.addEventListener('resize', resizeAll);
}
</script>
</body>
</html>
