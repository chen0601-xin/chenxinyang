<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频导览</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background:
                radial-gradient(1200px 600px at 50% -10%, rgba(40, 60, 110, 0.28), transparent 60%),
                radial-gradient(900px 500px at 100% 110%, rgba(20, 70, 80, 0.22), transparent 60%),
                #090c11;
            color: #fff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰大字 */
        .decor {
            position: fixed;
            z-index: 0;
            color: rgba(255, 255, 255, 0.035);
            font-family: Georgia, serif;
            font-weight: bold;
            user-select: none;
            pointer-events: none;
        }
        .decor.left  { left: -30px;   top: 42%;  font-size: 240px; transform: rotate(-90deg); transform-origin: left center; }
        .decor.right { right: -10px;  top: 30%;  font-size: 200px; }
        .decor.part  { right: 26px;   bottom: 18px; font-size: 64px; letter-spacing: .04em; }

        .wrap {
            position: relative;
            z-index: 1;
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
            padding: 56px 0 80px;
        }

        .head { margin-bottom: 30px; }
        .head .eyebrow {
            color: #5b6678;
            font-size: 13px;
            letter-spacing: .26em;
            margin-bottom: 10px;
        }
        .head h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: .06em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .card {
            position: relative;
            aspect-ratio: 485 / 235;          /* 接近截图的宽扁比例 */
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
        }

        .thumb {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform .55s cubic-bezier(.2, .7, .2, 1);
        }
        .thumb.grad {
            background-image:
                radial-gradient(circle at 30% 30%, rgba(31, 227, 154, .18), transparent 45%),
                linear-gradient(135deg, #0f3b3a 0%, #13314f 55%, #0a0d12 100%);
        }
        .card:hover .thumb { transform: scale(1.07); }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                rgba(0, 0, 0, 0.92) 0%,
                rgba(0, 0, 0, 0.45) 38%,
                rgba(0, 0, 0, 0) 72%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 18px 20px;
        }

        .play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.55);
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            opacity: 0;
            transition: opacity .3s, transform .3s;
        }
        .card:hover .play { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .cap h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 1px 5px rgba(0, 0, 0, .7);
        }
        .cap p {
            margin: 5px 0 0;
            font-size: 13px;
            color: #c9d1dd;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
        }
        .cap p.green { color: #1fe39a; }

        .meta {
            margin-top: 9px;
            font-size: 12px;
            color: #9aa4b2;
        }
        .tags { margin-top: 9px; display: flex; gap: 7px; }
        .tags span {
            font-size: 11px;
            padding: 2px 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            color: #dfe5ee;
        }

        @media (max-width: 680px) {
            .grid { grid-template-columns: 1fr; }
            .decor.left, .decor.right, .decor.part { display: none; }
        }
    </style>
</head>
<body>
    <div class="decor left">199</div>
    <div class="decor right">35</div>
    <div class="decor part">PART 03</div>

    <main class="wrap">
        <header class="head">
            <div class="eyebrow">PART 03 · VIDEO</div>
            <h1>视频导览</h1>
        </header>

        <section class="grid">
            <!-- 卡片 1 -->
            <article class="card">
                <div class="thumb" style="background-image:url('img/2.jpg')"></div>
                <div class="overlay">
                    <div class="play">▶</div>
                    <div class="cap">
                        <h3>疯疯火火三角洲</h3>
                        <p class="green">《三角洲行动》一年军进行曲</p>
                    </div>
                </div>
            </article>

            <!-- 卡片 2 -->
            <article class="card">
                <div class="thumb" style="background-image:url('img/4.jpg')"></div>
                <div class="overlay">
                    <div class="play">▶</div>
                    <div class="cap">
                        <h3>起源 S1 版本 CG</h3>
                        <p>也许每个人走上战场的原因不同，但目标只有一个</p>
                    </div>
                </div>
            </article>

            <!-- 卡片 3 -->
            <article class="card">
                <div class="thumb" style="background-image:url('img/5.jpg')"></div>
                <div class="overlay">
                    <div class="play">▶</div>
                    <div class="cap">
                        <h3>《三角洲行动》玩法实机演示</h3>
                        <p class="green">实机演示 · 高清画质</p>
                    </div>
                </div>
            </article>

            <!-- 卡片 4（深色渐变占位，可替换为 font/ 中的图片） -->
            <article class="card">
                <div class="thumb grad"></div>
                <div class="overlay">
                    <div class="play">▶</div>
                    <div class="cap">
                        <h3>三角洲行动</h3>
                        <p class="green">全球 FPS 全明星赛</p>
                        <div class="meta">2024.9.26 · 上海</div>
                        <div class="tags"><span>CG</span><span>PV</span></div>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
