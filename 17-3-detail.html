<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品列表</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 16px; }
        h2 { color: #235789; }
        .loading, .error { text-align: center; padding: 40px; color: #64748b; }
        .error { color: #c7254e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
        .card {
            border: 1px solid #e5d9c8; border-radius: 12px; background: #fff;
            overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(35,87,137,.15); border-color: #235789; }
        .card img { width: 100%; height: 160px; object-fit: contain; background: #f8f8f8; padding: 8px; box-sizing: border-box; }
        .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .card-title { font-size: 15px; font-weight: bold; color: #17233b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-desc { font-size: 12px; color: #64748b; line-height: 1.5; height: 36px; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { color: #e76f51; font-size: 18px; font-weight: bold; }
        .stock { font-size: 12px; color: #2ecc71; }
        .stock.out { color: #c7254e; }
        .tag { display: inline-block; background: #f6efe2; color: #235789; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .back { display: inline-block; margin-bottom: 16px; color: #235789; text-decoration: none; font-size: 14px; }
        .back:hover { text-decoration: underline; }
        .meta-bar { display: flex; gap: 12px; color: #64748b; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <a class="back" href="17-3.html">← 返回列表</a>
    <h2>陈新阳的商品详情</h2>
    <div class="meta-bar">
        <span>接口: <code>GET https://dummyjson.com/products/{id}</code></span>
    </div>
    <div id="detail"></div>

    <script>
        var params = new URLSearchParams(location.search);
        var id = params.get('id') || 1;
        var detailEl = document.getElementById('detail');

        async function loadDetail() {
            detailEl.innerHTML = '<div class="loading">⏳ 加载中 id=' + id + ' ...</div>';
            try {
                var res = await fetch('https://dummyjson.com/products/' + id);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var p = await res.json();
                console.log('商品详情:', p);

                var images = (p.images || []).map(function(url) {
                    return '<img src="' + url + '" alt="" style="width:100%;height:120px;object-fit:contain;background:#f8f8f8;border-radius:6px;padding:6px;box-sizing:border-box;">';
                }).join('');

                detailEl.innerHTML =
                    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">' +
                        '<div>' +
                            '<img src="' + p.thumbnail + '" alt="' + p.title + '" style="width:100%;border-radius:12px;background:#f8f8f8;padding:10px;box-sizing:border-box;">' +
                            '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;">' + images + '</div>' +
                        '</div>' +
                        '<div>' +
                            '<span class="tag">' + (p.category || '无分类') + '</span>' +
                            '<h2 style="margin:10px 0;">' + p.title + '</h2>' +
                            '<p style="color:#17233b;font-size:15px;line-height:1.7;">' + (p.description || '') + '</p>' +
                            '<p class="price" style="font-size:28px;">¥' + p.price + '</p>' +
                            '<p>品牌: ' + (p.brand || '未知') + '</p>' +
                            '<p>库存: <span class="stock ' + (p.stock < 10 ? 'out' : '') + '">' + p.stock + ' 件</span></p>' +
                            '<p>评分: ' + (p.rating || '-') + ' ⭐</p>' +
                            '<p>折扣: ' + (p.discountPercentage || 0) + '%</p>' +
                        '</div>' +
                    '</div>';
            } catch (err) {
                detailEl.innerHTML = '<div class="error">❌ 加载失败: ' + err.message + '</div>';
            }
        }
        loadDetail();
    </script>
</body>
</html>
