<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品列表</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 16px; }
        h2 { color: #235789; }
        .loading, .error { text-align: center; padding: 40px; color: #64748b; }
        .error { color: #c7254e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
        .card {
            border: 1px solid #e5d9c8; border-radius: 12px; background: #fff;
            overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(35,87,137,.15); border-color: #235789; }
        .card img { width: 100%; height: 160px; object-fit: contain; background: #f8f8f8; padding: 8px; box-sizing: border-box; }
        .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .card-title { font-size: 15px; font-weight: bold; color: #17233b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-desc { font-size: 12px; color: #64748b; line-height: 1.5; height: 36px; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { color: #e76f51; font-size: 18px; font-weight: bold; }
        .stock { font-size: 12px; color: #2ecc71; }
        .stock.out { color: #c7254e; }
        .tag { display: inline-block; background: #f6efe2; color: #235789; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .meta-bar { display: flex; gap: 12px; color: #64748b; font-size: 13px; margin-bottom: 12px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <h2>陈新阳的商品列表</h2>
    <div class="meta-bar">
        <span>接口: <code>GET https://dummyjson.com/products?limit=8</code></span>
    </div>
    <div id="list" class="loading">⏳ 加载中...</div>

    <script>
        var listEl = document.getElementById('list');

        async function loadProducts() {
            try {
                var res = await fetch('https://dummyjson.com/products?limit=8');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();
                var items = data.products || [];
                console.log('商品列表:', items);

                if (items.length === 0) {
                    listEl.className = 'error';
                    listEl.textContent = '没有商品';
                    return;
                }

                var html = items.map(function(p) {
                    return '<a href="17-3-detail.html?id=' + p.id + '" class="card" style="text-decoration:none;color:inherit;">' +
                        '<img src="' + p.thumbnail + '" alt="' + p.title + '">' +
                        '<div class="card-body">' +
                            '<span class="tag">' + (p.category || '') + '</span>' +
                            '<div class="card-title">' + p.title + '</div>' +
                            '<div class="card-desc">' + (p.description || '') + '</div>' +
                            '<div class="card-footer">' +
                                '<span class="price">¥' + p.price + '</span>' +
                                '<span class="stock ' + (p.stock < 10 ? 'out' : '') + '">' + p.stock + '件</span>' +
                            '</div>' +
                        '</div>' +
                    '</a>';
                }).join('');

                listEl.className = 'grid';
                listEl.innerHTML = html;
            } catch (err) {
                listEl.className = 'error';
                listEl.textContent = '❌ 加载失败: ' + err.message;
            }
        }
        loadProducts();
    </script>
</body>
</html>
