<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电视剧点击排行</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f2f3f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .box {
            width: min(520px, 100%);
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 20px 24px 26px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .06);
        }

        .box h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
            padding-left: 10px;
            border-left: 4px solid #e34242;
            line-height: 1.3;
        }

        /* ---------- 选项卡 ---------- */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 18px;
        }
        .tab {
            flex: 1;
            border: 1px solid #ddd;
            background: linear-gradient(#fdfdfd, #f1f1f1);
            color: #555;
            font-family: inherit;
            font-size: 14px;
            padding: 8px 0;
            cursor: pointer;
            transition: all .2s;
        }
        .tab:hover { color: #e34242; border-color: #e34242; }
        .tab.active {
            background: linear-gradient(#9a9a9a, #7d7d7d);
            border-color: #7d7d7d;
            color: #fff;
            font-weight: bold;
        }

        /* ---------- 两列榜单 ---------- */
        .list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 44px;
            min-height: 280px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            line-height: 1.5;
            padding: 9px 2px;
            border-bottom: 1px dotted #ececec;
            cursor: pointer;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .3s, transform .3s, background .2s;
        }
        .item.show { opacity: 1; transform: translateY(0); }
        .item:hover .name { color: #e34242; }
        .item:hover { background: #fffafa; }

        .num {
            width: 18px;
            text-align: center;
            font-weight: bold;
            font-style: italic;
            color: #aaa;
        }
        .item.top .num { color: #e34242; }
        .name {
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color .2s;
        }

        @media (max-width: 460px) {
            .list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="box">
        <h1>电视剧点击排行</h1>

        <!-- 可点击的选项卡 -->
        <div class="tabs" id="tabs">
            <button class="tab active" data-i="0">每日</button>
            <button class="tab" data-i="1">每周</button>
            <button class="tab" data-i="2">每月</button>
            <button class="tab" data-i="3">全部</button>
        </div>

        <!-- 两列文字榜单 -->
        <div class="list" id="list"></div>
    </main>

    <script>
        const data = [
            // 每日
            ['最美的时光', '咱们结婚吧', '渗透', '继承者们', '烽火佳人',
             '极品女士第2季', '爱闪亮', '兰陵王（2013）', '钱多多炼爱记', '苍狼'],
            // 每周
            ['咱们结婚吧', '继承者们', '最美的时光', '爱闪亮', '渗透',
             '兰陵王（2013）', '三十岁，你好', '钱多多炼爱记', '特种兵之火凤凰', '极品女士第2季'],
            // 每月
            ['特种兵之火凤凰', '咱们结婚吧', '继承者们', '金玉满堂', '王的女人',
             '爱闪亮', '爱情面前谁怕谁', '英雄联盟', '小爸爸', '我们这拨人'],
            // 全部
            ['永不磨灭的番号', '特种兵之火凤凰', '新还珠格格', '咱们结婚吧', '小爸爸',
             '心术', '乡村爱情5', '天天有喜', '一不小心爱上你', '夏日甜心']
        ];

        const tabs = document.querySelectorAll('.tab');
        const listBox = document.getElementById('list');

        function render(i) {
            tabs.forEach((t, k) => t.classList.toggle('active', k === i));
            listBox.innerHTML = '';

            data[i].forEach((name, k) => {
                const div = document.createElement('div');
                div.className = 'item' + (k < 3 ? ' top' : '');
                div.innerHTML =
                    '<span class="num">' + (k + 1) + '</span>' +
                    '<span class="name">' + name + '</span>';
                listBox.appendChild(div);
                setTimeout(() => div.classList.add('show'), 60 * k);
            });
        }

        tabs.forEach(btn => {
            btn.addEventListener('click', () => render(+btn.dataset.i));
        });

        render(0);
    </script>
</body>
</html>
