<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>实现效果预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #eef1f5;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 26px;
  }
  .phone {
    width: 375px; height: 667px;
    background: #fff; border-radius: 26px;
    box-shadow: 0 0 0 10px #1c1f24, 0 16px 40px rgba(15, 35, 70, .25);
    overflow: hidden; position: relative;
  }
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 132px; height: 19px; background: #1c1f24;
    border-radius: 0 0 12px 12px; z-index: 10;
  }
  iframe { width: 375px; height: 667px; border: 0; display: block; background: #fff; }
</style>
</head>
<body>
  <div class="phone"><div class="notch"></div>
    <iframe src="../13-5.html"></iframe>
  </div>
</body>
</html>
